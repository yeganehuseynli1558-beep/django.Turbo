<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Yeni Elan Əlavə Et - TURBO.AZ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
        .header { background: #cc0000; color: white; padding: 15px 30px; font-size: 24px; font-weight: bold; }
        .form-container { width: 500px; background: white; padding: 25px; margin: 30px auto; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .submit-btn { background: #28a745; color: white; border: none; padding: 10px 15px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        .submit-btn:hover { background: #218838; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

    <div class="header">TURBO.AZ - Yeni Elan</div>

    <div class="form-container">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label>Brend:</label>
                <input type="text" name="brand" required>
            </div>
            <div class="form-group">
                <label>Model:</label>
                <input type="text" name="model" required>
            </div>
            <div class="form-group">
                <label>Qiymət (AZN):</label>
                <input type="number" name="price" required>
            </div>
            <div class="form-group">
                <label>Şəhər:</label>
                <input type="text" name="city" required>
            </div>
            <div class="form-group">
                <label>Buraxılış ili:</label>
                <input type="number" name="year" required>
            </div>
            <div class="form-group">
                <label>Yürüş (km):</label>
                <input type="number" name="mileage" required>
            </div>
            <div class="form-group">
                <label>Şəkil:</label>
                <input type="file" name="image" required>
            </div>
            <button type="submit" class="submit-btn">Elanı Yerləşdir</button>
        </form>
        <a href="{% url 'home' %}" class="back-link">← Ana səhifəyə qayıt</a>
    </div>

</body>
</html>
